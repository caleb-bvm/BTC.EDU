{% if page.has_other_pages %}<nav class="catalog-pagination" aria-label="{% translate "Páginas" %}">{% if page.has_previous %}<a href="?pagina={{ page.previous_page_number }}&amp;q={{ query|urlencode }}&amp;tipo={{ kind|urlencode }}&amp;estado={{ state|urlencode }}&amp;orden={{ order|urlencode }}">{% translate "← Anterior" %}</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?pagina={{ page.next_page_number }}&amp;q={{ query|urlencode }}&amp;tipo={{ kind|urlencode }}&amp;estado={{ state|urlencode }}&amp;orden={{ order|urlencode }}">{% translate "Siguiente →" %}</a>{% endif %}</nav>{% endif %}
