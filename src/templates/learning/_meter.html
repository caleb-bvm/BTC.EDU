<div class="learning-meter">
  <div class="meter-label"><span><span data-progress-count>{% blocktranslate with completed=journey.completed total=journey.total %}{{ completed }} de {{ total }}{% endblocktranslate %}</span> {% translate "lecciones completadas" %}</span><strong data-progress-percentage>{{ journey.percentage }}%</strong></div>
  <progress class="progress-track" data-course-progress value="{{ journey.completed }}" max="{{ journey.total|default:1 }}" aria-label="{% translate "Progreso del curso" %}"></progress>
</div>
