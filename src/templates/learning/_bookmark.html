{% if bookmark_enabled %}<div class="bookmark-actions">{% if user.is_authenticated and user.account_type == 'student' %}<form method="post" action="{% url 'bookmark-toggle' bookmark_kind bookmark_pk %}">{% csrf_token %}<input type="hidden" name="account_id" value="{{ user.pk }}"><input type="hidden" name="action" value="{% if is_saved %}remove{% else %}save{% endif %}"><input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="btn btn-outline-dark">{% if is_saved %}✓ Guardado · Retirar{% else %}＋ Guardar para estudiar{% endif %}</button></form>{% if is_saved %}<a class="text-link" href="{% url 'workspace' %}?seccion=guardados#mis-guardados">Ver mis guardados →</a>{% endif %}{% elif not user.is_authenticated %}<a class="text-link" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">Entrar para guardar →</a>{% endif %}<small class="account-help">Guardar conserva la referencia; no compra ni amplía tu acceso.</small></div>{% endif %}
