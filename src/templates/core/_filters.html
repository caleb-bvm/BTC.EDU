<form class="academy-filters" action="{{ catalog_url }}" method="get" {% if not selector %}hx-get="{{ catalog_url }}" hx-target="#catalog" hx-swap="outerHTML" hx-push-url="true" hx-disabled-elt="button[type='submit']"{% endif %}>
  <div class="filter-search"><label for="catalog-query">Buscar</label><div class="search-control"><span aria-hidden="true">⌕</span><input class="form-control" id="catalog-query" type="search" name="q" value="{{ query }}" maxlength="200" placeholder="¿Qué quieres aprender?"></div></div>
  <div><label for="catalog-topic">Tema</label><select class="form-control" id="catalog-topic" name="tema"><option value="">Todos los temas</option>{% if topic_missing %}<option value="{{ topic_filter }}" selected>Tema no disponible</option>{% endif %}{% for topic in topics %}<option value="{{ topic.slug }}" {% if topic_filter == topic.slug %}selected{% endif %}>{{ topic.name }}</option>{% endfor %}</select></div>
  {% if show_level %}<div><label for="catalog-level">Nivel</label><select class="form-control" id="catalog-level" name="nivel"><option value="">Todos los niveles</option>{% for value, label in levels %}<option value="{{ value }}" {% if level_filter == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}
  {% if categories|length > 2 %}<div><label for="catalog-type">Formato</label><select class="form-control" id="catalog-type" name="tipo">{% for value, label in categories.items %}<option value="{{ value }}" {% if category == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% endif %}
  <div><label for="catalog-access">Acceso</label><select class="form-control" id="catalog-access" name="acceso"><option value="todos" {% if access_filter == 'todos' %}selected{% endif %}>Todo el contenido</option><option value="gratis" {% if access_filter == 'gratis' %}selected{% endif %}>Con contenido gratis</option><option value="pago" {% if access_filter == 'pago' %}selected{% endif %}>Con contenido de pago</option></select></div>
  <button class="btn btn-dark filter-submit" type="submit">Buscar <span aria-hidden="true">↗</span></button>
</form>
