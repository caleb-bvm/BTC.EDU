<section><p class="eyebrow">Cuenta de {{ space_label }}</p><h1>Una nueva contraseña.</h1>{% if validlink %}<div class="login-panel"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-dark" type="submit">Guardar contraseña</button></form></div>{% else %}<p>Este enlace venció, ya se utilizó o corresponde a otro espacio. Solicita nuevas instrucciones desde el acceso de tu cuenta.</p><a href="{% url login_name %}">Volver al acceso de {{ space_label }}</a>{% endif %}</section>
