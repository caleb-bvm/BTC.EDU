<div class="studio-media"><h4>{{ resource.title }}</h4><p>{{ resource.description }}</p><span class="mono">{{ resource.get_access_type_display }}</span>{% if resource.kind == 'video' %}<video controls preload="metadata" {% if resource.subtitles_id %}crossorigin="anonymous"{% endif %}><source src="{% url 'creator-review-file' submission.pk resource.asset_id %}" type="video/mp4">{% if resource.subtitles_id %}<track kind="subtitles" src="{% url 'creator-review-file' submission.pk resource.subtitles_id %}" srclang="es" label="Español" default>{% endif %}</video>{% else %}<p><a href="{% url 'creator-review-file' submission.pk resource.asset_id %}">Descargar {{ resource.asset.original_name }} ↓</a></p>{% endif %}{% if resource.body %}<details><summary>Transcripción o texto</summary>{{ resource.body|linebreaks }}</details>{% endif %}</div>
