<div class="studio-media"><h4>{{ resource.title }}</h4><span class="mono">{{ resource.get_access_type_display }}</span>{% if asset %}{% if asset.kind == 'video' %}<video controls preload="metadata"><source src="{% url 'creator-file' asset.pk %}" type="video/mp4">{% if subtitles %}<track kind="subtitles" src="{% url 'creator-file' subtitles.pk %}" srclang="es" label="Español" default>{% endif %}</video>{% else %}<p><a href="{% url 'creator-file' asset.pk %}">Descargar {{ asset.original_name }} ↓</a></p>{% endif %}{% else %}<p>Falta seleccionar un archivo.</p>{% endif %}{% if body %}<details><summary>Transcripción o texto</summary>{{ body|linebreaks }}</details>{% endif %}</div>
