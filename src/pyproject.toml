[project]
name = "micropayments-platform"
version = "0.1.0"
description = "Plataforma de aprendizaje y contenido con pagos simulados"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2.17,<5.3",
  "httpx>=0.27.2,<0.28",
  "python-dotenv>=1.2,<2",
  "qrcode>=8.2,<9",
]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py312"
exclude = [".local", ".venv", "static/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
